
name: Another World APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Another World source
        run: |
          unzip -q Another-World-1.0.0-source.zip -d source
          cp -a source/Another-World-1.0.0-source/. .

      - name: Setup Android and Rust
        uses: ./.github/actions/setup

      - name: Build APK
        run: ./gradlew :app:assembleDev --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Another-World-APK
          path: app/build/outputs/apk/dev/app-universal-dev.apk
          retention-days: 14
          if-no-files-found: error
